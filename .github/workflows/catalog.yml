name: catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly re-sign: hosts refuse an index older than its 30-day expiry
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

env:
  # ziroctl that builds and signs the catalog, pinned to a reviewed commit of ziro-os/ziro-os.
  ZIROCTL_REF: 01af74a2177d5c9a1ffe76f753fb53b851f53baf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ziro-os/ziro-os
          ref: ${{ env.ZIROCTL_REF }}
          path: .ziro-os
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: .ziro-os/tools/ziroctl/go.sum
      - name: Build ziroctl
        run: cd .ziro-os/tools/ziroctl && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ziroctl" .
      - name: Lint (strict: health checks, privilege drops)
        run: '"$RUNNER_TEMP/ziroctl" dev validate --strict .'
      - name: Build catalog (validates every definition; images must be pinned by digest)
        run: |
          "$RUNNER_TEMP/ziroctl" catalog build . --repo ziro-apps --kind app --out public
          cp catalog.pub public/
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          ZIRO_CATALOG_KEY: ${{ secrets.ZIRO_CATALOG_KEY }}
        run: |
          "$RUNNER_TEMP/ziroctl" catalog sign public
          "$RUNNER_TEMP/ziroctl" catalog verify public --repo ziro-apps --kind app --key catalog.pub
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
